<!-- card.html — Canonical Card Component (v1) -->
<!-- used_by: index, services -->
<!-- variant: border-hover (warm-minimal adaptation) -->
<!-- slots: icon, title, description, price -->

<div class="group rounded-2xl border border-stone-200 bg-white p-8 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md hover:border-stone-300">
  <!-- Icon -->
  <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-emerald-50 text-emerald-600">
    {{icon}}
  </div>
  <!-- Title -->
  <h3 class="mt-6 font-nunito text-xl font-semibold text-stone-900">
    {{title}}
  </h3>
  <!-- Description -->
  <p class="mt-3 text-base leading-relaxed text-stone-500">
    {{description}}
  </p>
  <!-- Price (optional) -->
  {{price}}
</div>
