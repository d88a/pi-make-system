<!-- button.html — Canonical Button Component (v1) -->
<!-- used_by: index, services, about, contact -->
<!-- variant: primary-secondary -->

<!-- Primary Button -->
<a href="{{href}}" class="inline-flex items-center rounded-md bg-emerald-600 px-6 py-3 text-base font-medium text-white hover:bg-emerald-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-stone-50">
  {{label}}
</a>

<!-- Secondary Button -->
<a href="{{href}}" class="inline-flex items-center rounded-md border border-stone-300 bg-white px-6 py-3 text-base font-medium text-stone-700 hover:bg-stone-50 transition duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-stone-50">
  {{label}}
</a>
