<!-- team-card.html — Canonical Team Card Component (v1) -->
<!-- used_by: about -->
<!-- variant: photo-name -->

<div class="group rounded-2xl border border-stone-200 bg-white p-6 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md hover:border-stone-300">
  <div class="aspect-square overflow-hidden rounded-xl bg-stone-100">
    <img src="{{photo}}" alt="{{name}}" class="h-full w-full object-cover" loading="lazy">
  </div>
  <div class="mt-6 text-center">
    <h3 class="font-nunito text-lg font-semibold text-stone-900">{{name}}</h3>
    <p class="mt-1 text-sm font-medium text-emerald-600">{{role}}</p>
    <p class="mt-3 text-sm leading-relaxed text-stone-500">{{bio}}</p>
  </div>
</div>
