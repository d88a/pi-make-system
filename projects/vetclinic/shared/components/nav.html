<!-- nav.html — Canonical Navigation Component (v1) -->
<!-- used_by: index, services, about, contact -->
<!-- variant: sticky-backdrop (warm-minimal adaptation) -->

<header class="sticky top-0 z-50 h-16 border-b border-stone-200 bg-stone-50/90 backdrop-blur-sm">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <!-- Logo -->
    <a href="index.html" class="flex items-center gap-2 font-nunito text-xl font-bold text-stone-900 hover:text-emerald-600 transition-colors duration-200" aria-label="ЛапЛап — на главную">
      <!-- Paw SVG -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-600">
        <path d="M12 14c-2 0-3.5 1.5-3.5 3.5S10 21 12 21s3.5-1.5 3.5-3.5S14 14 12 14z"/>
        <path d="M8 8c0-1.5 1-3 2.5-3s2.5 1.5 2.5 3-1 3-2.5 3S8 9.5 8 8z"/>
        <path d="M16 8c0-1.5 1-3 2.5-3s2.5 1.5 2.5 3-1 3-2.5 3S16 9.5 16 8z"/>
        <path d="M5 10c0-1 1-2 2-2s2 1 2 2-1 2-2 2-2-1-2-2z"/>
        <path d="M19 10c0-1 1-2 2-2s2 1 2 2-1 2-2 2-2-1-2-2z"/>
      </svg>
      ЛапЛап
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center gap-8" aria-label="Основная навигация">
      <a href="index.html" class="nav-link text-sm font-medium text-emerald-600 transition-colors duration-200" data-page="index">
        Главная
      </a>
      <a href="services.html" class="nav-link text-sm font-medium text-stone-600 hover:text-stone-900 transition-colors duration-200" data-page="services">
        Услуги
      </a>
      <a href="about.html" class="nav-link text-sm font-medium text-stone-600 hover:text-stone-900 transition-colors duration-200" data-page="about">
        О нас
      </a>
      <a href="contact.html" class="nav-link text-sm font-medium text-stone-600 hover:text-stone-900 transition-colors duration-200" data-page="contact">
        Контакты
      </a>
    </nav>

    <!-- Desktop CTA -->
    <div class="hidden md:flex items-center gap-4">
      <a href="contact.html" class="inline-flex items-center rounded-md bg-emerald-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-emerald-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-stone-50">
        Записаться
      </a>
    </div>

    <!-- Mobile menu button -->
    <button id="mobile-menu-btn" class="md:hidden inline-flex items-center justify-center rounded-md p-2 text-stone-600 hover:bg-stone-100 hover:text-stone-900 transition duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-500" aria-expanded="false" aria-label="Открыть меню">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path id="menu-icon-open" stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
        <path id="menu-icon-close" class="hidden" stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Mobile menu panel -->
  <div id="mobile-menu" class="hidden md:hidden">
    <div class="space-y-1 border-t border-stone-200 bg-white px-4 pb-4 pt-2 shadow-lg">
      <a href="index.html" class="mobile-link block rounded-md px-3 py-2 text-base font-medium text-emerald-600" data-page="index">Главная</a>
      <a href="services.html" class="mobile-link block rounded-md px-3 py-2 text-base font-medium text-stone-600 hover:bg-stone-50 hover:text-stone-900" data-page="services">Услуги</a>
      <a href="about.html" class="mobile-link block rounded-md px-3 py-2 text-base font-medium text-stone-600 hover:bg-stone-50 hover:text-stone-900" data-page="about">О нас</a>
      <a href="contact.html" class="mobile-link block rounded-md px-3 py-2 text-base font-medium text-stone-600 hover:bg-stone-50 hover:text-stone-900" data-page="contact">Контакты</a>
      <a href="contact.html" class="mt-2 block rounded-md bg-emerald-600 px-3 py-2.5 text-center text-base font-medium text-white hover:bg-emerald-700 transition duration-200">Записаться на приём</a>
    </div>
  </div>
</header>

<script>
(function() {
  const btn = document.getElementById('mobile-menu-btn');
  const menu = document.getElementById('mobile-menu');
  const iconOpen = document.getElementById('menu-icon-open');
  const iconClose = document.getElementById('menu-icon-close');
  if (btn && menu) {
    btn.addEventListener('click', function() {
      const isOpen = !menu.classList.contains('hidden');
      menu.classList.toggle('hidden');
      if (iconOpen && iconClose) {
        iconOpen.classList.toggle('hidden', !isOpen);
        iconClose.classList.toggle('hidden', isOpen);
      }
      btn.setAttribute('aria-expanded', !isOpen);
    });
  }
})();
</script>
