<!-- hero.html — Canonical Hero Component (v1) -->
<!-- used_by: index -->
<!-- variant: centered-cta (warm-minimal adaptation) -->

<section class="bg-stone-50 pt-40 pb-32">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-3xl text-center">
      <!-- Eyebrow -->
      <span class="inline-flex items-center gap-2 rounded-full bg-emerald-50 px-4 py-1.5 text-xs font-medium tracking-wider uppercase text-emerald-700">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 14c-2 0-3.5 1.5-3.5 3.5S10 21 12 21s3.5-1.5 3.5-3.5S14 14 12 14z"/>
        </svg>
        Забота о каждом
      </span>

      <!-- Hero title -->
      <h1 class="mt-6 font-nunito text-5xl font-bold tracking-tight text-stone-900 sm:text-6xl lg:text-7xl">
        Ваш питомец<br>в надёжных руках
      </h1>

      <!-- Hero subtitle -->
      <p class="mx-auto mt-8 max-w-2xl text-xl leading-relaxed text-stone-500">
        Современная ветеринарная клиника с заботливым подходом. Лечим, прививаем, консультируем — чтобы ваш друг был здоров и счастлив.
      </p>

      <!-- CTA Buttons -->
      <div class="mt-12 flex flex-col items-center gap-4 sm:flex-row sm:justify-center">
        <a href="contact.html" class="inline-flex items-center rounded-md bg-amber-600 px-8 py-4 text-base font-medium text-white hover:bg-amber-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:ring-offset-2 focus:ring-offset-stone-50">
          Записаться на приём
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ml-2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
        <a href="services.html" class="inline-flex items-center rounded-md border border-stone-300 bg-white px-8 py-4 text-base font-medium text-stone-700 hover:bg-stone-50 transition duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 focus:ring-offset-stone-50">
          Наши услуги
        </a>
      </div>

      <!-- Pet photos row -->
      <div class="mt-16 flex items-center justify-center gap-4">
        <div class="h-20 w-20 overflow-hidden rounded-2xl border-2 border-white shadow-sm">
          <img src="https://placehold.co/80x80/e7e5e4/a8a29e?text=🐕" alt="Собака" class="h-full w-full object-cover" loading="lazy">
        </div>
        <div class="h-24 w-24 overflow-hidden rounded-2xl border-2 border-white shadow-sm">
          <img src="https://placehold.co/96x96/e7e5e4/a8a29e?text=🐱" alt="Кот" class="h-full w-full object-cover" loading="lazy">
        </div>
        <div class="h-20 w-20 overflow-hidden rounded-2xl border-2 border-white shadow-sm">
          <img src="https://placehold.co/80x80/e7e5e4/a8a29e?text=🐹" alt="Хомяк" class="h-full w-full object-cover" loading="lazy">
        </div>
        <div class="h-24 w-24 overflow-hidden rounded-2xl border-2 border-white shadow-sm">
          <img src="https://placehold.co/96x96/e7e5e4/a8a29e?text=🐰" alt="Кролик" class="h-full w-full object-cover" loading="lazy">
        </div>
        <div class="h-20 w-20 overflow-hidden rounded-2xl border-2 border-white shadow-sm">
          <img src="https://placehold.co/80x80/e7e5e4/a8a29e?text=🦜" alt="Попугай" class="h-full w-full object-cover" loading="lazy">
        </div>
      </div>

      <!-- Trust text -->
      <p class="mt-8 text-sm text-stone-400">
        Более 2 000 довольных питомцев и их хозяев
      </p>
    </div>
  </div>
</section>
