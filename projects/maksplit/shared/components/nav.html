<!-- ============================================================ -->
<!-- NAVIGATION — Concrete Steel + Steel Blue #3B5F8A -->
<!-- Sticky, backdrop-blur, border-b-2 (steel beam). -->
<!-- 7 items: Главная, Каталог, О компании, Доставка, Контакты, + CTA -->
<!-- Mobile: JS hamburger toggle. -->
<!-- ============================================================ -->
<header class="sticky top-0 z-50 h-16 border-b-2 border-[var(--color-border)] bg-[var(--color-bg-page)]/90 backdrop-blur-md" role="banner">
  <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8" aria-label="Основная навигация">
    <!-- Logo -->
    <a href="/" class="flex items-center gap-3 font-display text-xl font-bold text-[var(--color-text-primary)] transition-opacity duration-150 hover:opacity-80" aria-label="СтройМакс — на главную">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" class="text-[var(--color-primary)]" aria-hidden="true">
        <rect x="2" y="2" width="10" height="24" rx="1" fill="currentColor"/>
        <rect x="16" y="2" width="10" height="24" rx="1" fill="currentColor" opacity="0.5"/>
        <rect x="2" y="12" width="24" height="4" rx="1" fill="currentColor" opacity="0.7"/>
      </svg>
      <span class="tracking-tight">СтройМакс</span>
    </a>

    <!-- Desktop menu -->
    <div class="hidden items-center gap-8 lg:flex" role="menubar">
      <a href="/" class="font-body text-sm font-medium text-[var(--color-text-primary)] transition-colors duration-150 hover:text-[var(--color-primary)]" role="menuitem">Главная</a>
      <a href="/catalog" class="font-body text-sm font-medium text-[var(--color-text-secondary)] transition-colors duration-150 hover:text-[var(--color-text-primary)]" role="menuitem">Каталог</a>
      <a href="/about" class="font-body text-sm font-medium text-[var(--color-text-secondary)] transition-colors duration-150 hover:text-[var(--color-text-primary)]" role="menuitem">О компании</a>
      <a href="/delivery" class="font-body text-sm font-medium text-[var(--color-text-secondary)] transition-colors duration-150 hover:text-[var(--color-text-primary)]" role="menuitem">Доставка</a>
      <a href="/contacts" class="font-body text-sm font-medium text-[var(--color-text-secondary)] transition-colors duration-150 hover:text-[var(--color-text-primary)]" role="menuitem">Контакты</a>
    </div>

    <!-- Right actions -->
    <div class="flex items-center gap-3">
      <a href="tel:+73514712345" class="hidden items-center gap-1.5 text-sm font-medium text-[var(--color-text-secondary)] transition-colors duration-150 hover:text-[var(--color-text-primary)] lg:flex">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"/>
        </svg>
        +7 (35147) 1-23-45
      </a>
      <a href="#calculate" class="rounded-md bg-[var(--color-primary)] px-5 py-2.5 font-body text-sm font-semibold text-white transition-all duration-200 hover:bg-[var(--color-primary-hover)] hover:shadow-[var(--shadow-brand)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:ring-offset-2 focus:ring-offset-[var(--color-bg-page)]">
        Рассчитать стоимость
      </a>
      <!-- Mobile hamburger -->
      <button id="mobile-toggle" class="rounded-md p-2 text-[var(--color-text-secondary)] transition-colors duration-150 hover:bg-[var(--color-bg-alt)] hover:text-[var(--color-text-primary)] lg:hidden" aria-label="Открыть меню" aria-expanded="false" aria-controls="mobile-menu">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="hidden border-t-2 border-[var(--color-border)] bg-[var(--color-bg-page)] lg:hidden" role="menu" aria-label="Мобильное меню">
    <div class="space-y-1 px-4 py-4">
      <a href="/" class="block rounded-md px-3 py-2.5 font-body text-sm font-medium text-[var(--color-text-primary)] transition-colors duration-150 hover:bg-[var(--color-bg-alt)]" role="menuitem">Главная</a>
      <a href="/catalog" class="block rounded-md px-3 py-2.5 font-body text-sm font-medium text-[var(--color-text-secondary)] transition-colors duration-150 hover:bg-[var(--color-bg-alt)] hover:text-[var(--color-text-primary)]" role="menuitem">Каталог</a>
      <a href="/about" class="block rounded-md px-3 py-2.5 font-body text-sm font-medium text-[var(--color-text-secondary)] transition-colors duration-150 hover:bg-[var(--color-bg-alt)] hover:text-[var(--color-text-primary)]" role="menuitem">О компании</a>
      <a href="/delivery" class="block rounded-md px-3 py-2.5 font-body text-sm font-medium text-[var(--color-text-secondary)] transition-colors duration-150 hover:bg-[var(--color-bg-alt)] hover:text-[var(--color-text-primary)]" role="menuitem">Доставка</a>
      <a href="/contacts" class="block rounded-md px-3 py-2.5 font-body text-sm font-medium text-[var(--color-text-secondary)] transition-colors duration-150 hover:bg-[var(--color-bg-alt)] hover:text-[var(--color-text-primary)]" role="menuitem">Контакты</a>
      <a href="tel:+73514712345" class="flex items-center gap-2 rounded-md px-3 py-2.5 font-body text-sm font-medium text-[var(--color-text-secondary)] transition-colors duration-150 hover:bg-[var(--color-bg-alt)]" role="menuitem">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"/></svg>
        +7 (35147) 1-23-45
      </a>
    </div>
  </div>
</header>

<style>
  .nav-link { transition: color 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
  .nav-cta { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
</style>

<script>
  (function() {
    var toggle = document.getElementById('mobile-toggle');
    var menu = document.getElementById('mobile-menu');
    if (toggle && menu) {
      toggle.addEventListener('click', function() {
        var expanded = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!expanded));
        menu.classList.toggle('hidden');
      });
    }
  })();
</script>
